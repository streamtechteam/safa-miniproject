<div class="mat-shadow-2 table-container">
  <div class="table__actions">
    <mat-form-field appearance="outline">
      <mat-label>جستجو</mat-label>
      <mat-icon matPrefix>search</mat-icon>
      <input
        #searchInput
        matInput
        (keyup)="applyFilter($event.target.value)"
        placeholder="جستجو..."
        [formControl]="searchField"
      />
      @if (searchField.getRawValue()) {
      <button
        type="button"
        matSuffix
        matIconButton
        aria-label="Clear"
        (click)="searchField.setValue('')"
      >
        <mat-icon>close</mat-icon>
      </button>
      }
    </mat-form-field>
    <button matButton="filled" type="button" (click)="addDialog = true; editDialog.enabled= false">
      <mat-icon>add</mat-icon>
      افزودن
    </button>
  </div>
  <div class="table">
    <table mat-table [dataSource]="dataSource">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>آیدی</th>
        <td mat-cell *matCellDef="let user">{{user.id}}</td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>نام</th>
        <td mat-cell *matCellDef="let user">{{user.name}}</td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>ایمیل</th>
        <td mat-cell *matCellDef="let user">{{user.email}}</td>
      </ng-container>

      <ng-container matColumnDef="role">
        <th mat-header-cell *matHeaderCellDef>نقش</th>
        <td mat-cell *matCellDef="let user">{{user.role}}</td>
      </ng-container>

      <ng-container matColumnDef="username">
        <th mat-header-cell *matHeaderCellDef>نام کاربری</th>
        <td mat-cell *matCellDef="let user">{{user.username}}</td>
      </ng-container>

      <ng-container matColumnDef="password">
        <th mat-header-cell *matHeaderCellDef>رمز عبور</th>
        <td mat-cell *matCellDef="let user">{{user.password}}</td>
      </ng-container>

      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef>عملیات</th>
        <td mat-cell *matCellDef="let user" style="min-width: 8rem">
          <button mat-icon-button (click)="deleteUser(user.id)" type="button">
            <mat-icon>delete</mat-icon>
          </button>
          <button mat-icon-button (click)="editUser(user.id)" type="button">
            <mat-icon>edit</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>

  <mat-paginator
    [pageSizeOptions]="[5, 10, 20]"
    showFirstLastButtons
    aria-label="Select page of users"
  >
  </mat-paginator>
</div>

@if (editDialog.enabled){
<app-edit-form (closed)="editDialog.enabled = false" [id]="editDialog.id"></app-edit-form>
} @if (addDialog){
<app-add-form (closed)="addDialog = false"></app-add-form>
}
