<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #sidenav [mode]="platform === 'mobile' ? 'push' : 'side'" opened class="sidenav">
    <mat-toolbar class="sidenav__header">
      <img class="sidenav__icon" src="./shiraz.png" alt="" />
    </mat-toolbar>
    <div class="sidenav__title">سامانه کنترل و نظارت ناوگان</div>
    <div class="sidenav__datetime">{{datetime()}}</div>

    <mat-nav-list class="sidenav__item-list">
      <div class="sidenav__item" routerLink="/dashboard/map" routerLinkActive="active">
        <mat-icon>my_location</mat-icon>
        <span> ردیابی </span>
      </div>
      <div class="sidenav__item" routerLink="/dashboard/users" routerLinkActive="active">
        <mat-icon>person</mat-icon>
        <span> کاربران </span>
      </div>

      <div class="sidenav__item" routerLink="/dashboard/fleet" routerLinkActive="active">
        <mat-icon>directions_car</mat-icon>
        <span> ناوگان </span>
      </div>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="main-toolbar" color="primary">
      <div class="main-toolbar__title">
        <button type="button" mat-icon-button (click)="sidenav.toggle()" dir="ltr">
          <mat-icon>menu</mat-icon>
        </button>

        <span>{{toolbarTitle()}}</span>
      </div>

      <div class="main-toolbar__profile-container">
        <app-profile-menu></app-profile-menu>

        <button mat-icon-button (click)="toggleDarkMode()">
          <mat-icon>{{ isDarkMode() ? 'light_mode' : 'dark_mode' }}</mat-icon>
        </button>
      </div>
    </mat-toolbar>

    <div class="content">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
