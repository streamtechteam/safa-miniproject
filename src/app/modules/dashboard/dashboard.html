<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #sidenav mode="side" opened class="sidenav">
    <mat-toolbar class="mat-sidenav__mat-toolbar">
      <img class="mat-sidenav__mat-toolbar__icon" src="./shiraz.png" alt="" />
    </mat-toolbar>
    <div class="mat-sidenav__label">سامانه کنترل و نظارت ناوگان</div>
    <div class="mat-sidenav__datetime">{{datetime}}</div>
    <div></div>
    <mat-nav-list class="mat-sidenav__mat-nav-list">
      <div
        class="mat-sidenav__mat-nav-list__item"
        routerLink="/dashboard/map"
        routerLinkActive="active"
      >
        <mat-icon>my_location</mat-icon>
        <span> ردیابی </span>
      </div>
      <div
        class="mat-sidenav__mat-nav-list__item"
        routerLink="/dashboard/users"
        routerLinkActive="active"
      >
        <mat-icon>person</mat-icon>
        <span> کاربران </span>
      </div>

      <div
        class="mat-sidenav__mat-nav-list__item"
        routerLink="/dashboard/fleet"
        routerLinkActive="active"
      >
        <mat-icon>directions_car</mat-icon>
        <span> ناوگان </span>
      </div>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="mat-sidenav-content__mat-toolbar" color="primary">
      <div class="mat-sidenav-content__mat-toolbar__title-container">
        <button type="button" mat-icon-button (click)="sidenav.toggle()" dir="ltr">
          <mat-icon>menu</mat-icon>
        </button>

        <span style="font-family: 'Vazirmatn'">{{toolbarTitle()}}</span>
      </div>

      <app-profile-menu></app-profile-menu>
    </mat-toolbar>

    <div class="content">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
